<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offline resources</title><style>
[hidden]{display:none!important}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#242229;color:#f6f4fa;font-family:system-ui,sans-serif}main{max-width:650px;padding:48px}h1{font-size:34px}p{line-height:1.7;color:#ccc}button,a{display:inline-block;background:#8065aa;color:white;border:0;border-radius:28px;padding:14px 24px;font:600 16px system-ui;text-decoration:none;cursor:pointer}button:disabled{opacity:.6;cursor:wait}progress{width:100%;margin-top:24px;accent-color:#a98ed2}#message{white-space:pre-wrap}select{background:#35313f;color:white;border:0;padding:10px;border-radius:8px}a{margin-left:12px;background:#45404f}small{color:#aaa}</style><main><select id="language"><option value="en">English</option><option value="zh">简体中文</option></select><h1 id="title"></h1><p id="description"></p><p id="current"></p><button id="import"></button><a href="/index.html" id="home" hidden></a><progress id="progress" hidden value="0" max="100"></progress><p id="message" role="status"></p><small id="hint"></small></main><script>
const copy={en:{title:'Offline resources',description:'Choose the resource ZIP to get started. Windows and macOS use the same resource pack. After importing, you can use the app without an internet connection.',import:'Import resource pack',home:'Back to Home',ready:'Resources are ready. You can import a newer pack here at any time.',missing:'No resource pack has been imported yet.',hint:'Program updates reuse your resources. A new pack replaces the current selection only after it has been fully verified. Earlier packs remain on this computer.',working:'Importing and verifying…',cancel:'Import cancelled. Your current resources are unchanged.'},zh:{title:'离线资源',description:'请选择下载好的资源 ZIP。Windows 和 macOS 共用同一份资源包，导入后无需联网即可使用。',import:'导入资源包',home:'返回首页',ready:'资源已就绪。以后可在这里导入新版资源包。',missing:'首次使用，请先导入资源包。',hint:'更新程序会复用已导入的资源。新版资源完整校验成功后才切换；之前的资源包仍保留在本机。',working:'正在导入并校验…',cancel:'已取消导入，原有资源保持不变。'}};
let ready=false;const select=document.querySelector('#language');select.value=(localStorage.getItem('resources-locale')||localStorage.getItem('ui-language')||navigator.language).startsWith('zh')||localStorage.getItem('resources-locale')==='CNzh'?'zh':'en';
function render(){const t=copy[select.value];for(const id of ['title','description','import','home','hint'])document.getElementById(id).textContent=t[id];document.querySelector('#current').textContent=t[ready?'ready':'missing'];document.querySelector('#home').hidden=!ready;}select.onchange=render;render();
window.__TAURI__.core.invoke('resource_pack_status').then(value=>{ready=value;render()});
window.__TAURI__.event.listen('resource-import-progress',event=>{const [done,total]=event.payload;document.querySelector('#progress').value=total?100*done/total:100;});
document.querySelector('#import').onclick=async()=>{const button=document.querySelector('#import'),progress=document.querySelector('#progress'),message=document.querySelector('#message');button.disabled=true;progress.hidden=false;progress.value=0;message.textContent=copy[select.value].working;try{const imported=await window.__TAURI__.core.invoke('import_resources');if(imported){ready=true;render();message.textContent=copy[select.value].ready;}else message.textContent=copy[select.value].cancel;}catch(error){message.textContent=String(error);}finally{button.disabled=false;progress.hidden=true;}};
</script></html>
