[package]
name = "splatoon-blender-desktop"
version = "1.1.2"
description = "Offline Splatoon Blender tools and resources"
authors = ["Coconuts XXS"]
license = "MIT"
repository = "https://github.com/CoconutsXXS/Splatoon-Blender"
edition = "2021"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "splatoon_blender_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = [] }
percent-encoding = "2.3.2"
tauri-plugin-dialog = "2.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2"] }
# zip does not select a backend; use the portable Rust inflater on both platforms.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
